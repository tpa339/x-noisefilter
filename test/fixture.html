<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Fixture – X-Thread</title></head>
<body>
<div data-testid="primaryColumn" id="col">
</div>
<script>
  // Vereinfachter Nachbau der X-DOM-Struktur für Tests (keine echten Daten).
  const tweets = [
    { id: "99", user: "vorgaenger", text: "Morgen ist der IPO, was erwartet ihr?" },
    { id: "100", user: "autorin", text: "Anthropic geht morgen an die Börse. Ausgabepreis laut Prospekt 120 $, Volumen 8 Mrd $." },
    { id: "201", user: "analyst", text: "Laut S-1 Seite 47 liegt der Umsatz-Run-Rate bei 9 Mrd $, das wäre ein Multiple von etwa 40." },
    { id: "202", user: "fan", text: "Great post! 🔥🔥" },
    { id: "203", user: "emoji", text: "🚀🚀🚀" },
    { id: "204", user: "copy1", text: "Anthropic ist so böse, lest das alte Paper von 2023!!!" },
    { id: "205", user: "copy2", text: "Anthropic ist so böse, lest das alte Paper von 2023!!" },
    { id: "206", user: "promo", text: "Check out my crypto signals channel, link in bio" },
  ];
  function articleHtml(t) {
    return `<div data-testid="cellInnerDiv"><article data-testid="tweet"><div class="inner">
      <div data-testid="User-Name"><a href="/${t.user}">${t.user}</a></div>
      <a href="/${t.user}/status/${t.id}"><time datetime="2026-11-18T10:00:00Z">1h</time></a>
      <div data-testid="tweetText">${t.text}</div>
    </div></article></div>`;
  }
  document.getElementById("col").innerHTML = tweets.map(articleHtml).join("");
  // Später nachgeladene Antwort, wie beim Scrollen.
  setTimeout(() => {
    document.getElementById("col").insertAdjacentHTML("beforeend",
      articleHtml({ id: "207", user: "spaet", text: "Wichtig: Lock-up endet erst nach 180 Tagen, steht im Prospekt Abschnitt 9." }));
  }, 1500);
</script>
</body>
</html>
